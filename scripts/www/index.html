<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水果消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  background: linear-gradient(135deg,#4158D0,#C850C0,#FFCC70);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:12px;font-family:system-ui,sans-serif;
}
/* ========== 【开始页面样式】 ========== */
#startWrap{
  width:100%;
  min-height:90vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
}
.start-title{
  font-size:42px;
  color:#ffffff;
  font-weight:bold;
  text-shadow: 0px 4px 10px rgba(0,0,0,0.25);
}
.start-desc{
  font-size:18px;
  color:#fff;
  opacity:0.9;
  text-shadow:0 2px 4px rgba(0,0,0,0.15);
}
.fruit-decor{
  display:flex;
  gap:12px;
  font-size:44px;
  margin:10px 0;
}
#startBtnBig{
  padding:16px 44px;font-size:22px;border-radius:99px;border:none;
  background:linear-gradient(135deg,#ff6b6b,#ff9e7d);color:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,0.22);
  transition: transform 0.2s ease;
}
#startBtnBig:active{
  transform:scale(0.96);
}
/* ========== 游戏面板（美化后的信息框） ========== */
#panel{
  width:min(92vw,600px);
  margin-bottom:10px;
  background: rgba(255, 255, 255, 0.88);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.info-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.info-row span {
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,255,0.95));
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 16px;
  color: #222;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.8),
    0 4px 10px rgba(0,0,0,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.info-row span span {
  background: none;
  border: none;
  padding: 0;
  box-shadow: none;
  font-weight: 700;
  font-size: 17px;
}
#level {
  color: #ffd93d;
}
#goal {
  color: #4d96ff;
}
#score {
  color: #ff6b6b;
}
#step {
  color: #6bcb77;
}
#timer {
  color: #c084fc;
}
#bestScore {
  color: #ff9e7d;
}
/* ========== 游戏方块样式 ========== */
#gameBox{
  display:grid;
  gap:5px;
}
/* 方块固定大小！不会改变尺寸 */
.cell{
  width:52px;
  height:52px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  background:linear-gradient(145deg,#ffffff,#e8edff);
  box-shadow:0 3px 6px #00000026;
  transition: transform 0.15s ease;
  border:1px solid rgba(255,255,255,0.6);
}
.cell.selected{border:3px solid #ff4444;transform:scale(1.04);}
.cell.pop{
  animation: popAnim 0.3s ease forwards;
}
@keyframes popAnim {
  0% {transform: scale(1); opacity:1;}
  50% {transform: scale(1.25);}
  100% {transform: scale(0); opacity:0;}
}
#tip{margin-top:12px;font-size:19px;color:#fff;height:28px;text-align:center;font-weight:bold;text-shadow:0 1px 3px #0004;}
#resultBox{
  background:rgba(255,255,255,0.94);
  border-radius:14px;padding:16px;margin-top:12px;text-align:center;display:none;
}
#resultBox h3{margin:0 0 8px;color:#222;}
#resultBox p{margin:4px 0;color:#444;}
#restartBtn{margin-top:10px;padding:12px 20px;font-size:17px;border:none;border-radius:10px;background:linear-gradient(135deg,#2b78e4,#529aff);color:white;box-shadow:0 3px 8px #0003;}

/* ========== 【新增：过关奖章弹窗样式】 ========== */
/* 遮罩层 */
.win-mask{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
/* 奖章弹窗容器 */
.win-modal{
  background: #fff;
  width: min(85vw,320px);
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  transform:scale(0.6);
  opacity:0;
  animation: modalPop 0.4s ease-out forwards;
}
@keyframes modalPop {
  0%{transform:scale(0.6);opacity:0;}
  70%{transform:scale(1.08);opacity:1;}
  100%{transform:scale(1);opacity:1;}
}
/* 金色奖章 */
.medal-icon{
  font-size:70px;
  margin-bottom:12px;
  animation: medalShine 1.2s ease-in-out infinite;
}
@keyframes medalShine {
  0%{transform: rotate(-8deg);}
  50%{transform: rotate(8deg);}
  100%{transform: rotate(-8deg);}
}
/* 彩虹渐变过关文字 */
.win-text{
  font-size:26px;
  font-weight:800;
  background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c084fc,#ff6b6b);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation: gradientShift 3s linear infinite;
  margin-bottom:10px;
}
@keyframes gradientShift {
  0%{background-position:0% 0;}
  100%{background-position:300% 0;}
}
.win-count{
  font-size:17px;
  color:#555;
}
</style>
</head>
<body>
<!-- 过关奖章弹窗 -->
<div class="win-mask" id="winMask">
  <div class="win-modal">
    <div class="medal-icon">🏅</div>
    <div class="win-text">恭喜过关！</div>
    <div class="win-count" id="winCountText">10秒后自动进入下一关</div>
  </div>
</div>

<!-- ========== 【开始页面HTML】 ========== -->
<div id="startWrap">
  <div class="fruit-decor">🍎🍊🍇</div>
  <div class="start-title">水果消消乐</div>
  <div class="start-desc">交换水果，达成目标分数，挑战更高关卡</div>
  <div class="start-desc">YKN</div>
  <div class="fruit-decor">🍓🍋🥝</div>
  <button id="startBtnBig">🎮 开始游戏 🎮</button>
</div>

<div id="panel" style="display:none;">
  <div class="info-row">
    <span>关卡：<span id="level">1</span></span>
    <span>目标分数：<span id="goal">500</span></span>
  </div>
  <div class="info-row">
    <span>当前分数：<span id="score">0</span></span>
    <span>剩余步数：<span id="step">30</span></span>
  </div>
  <div class="info-row">
    <span>剩余时间：<span id="timer">90</span>秒</span>
    <span>最高分：<span id="bestScore">0</span></span>
  </div>
</div>
<div id="gameBox"></div>
<div id="tip"></div>

<div id="resultBox">
  <h3 id="resTitle"></h3>
  <p id="resText"></p>
  <button id="restartBtn">重新开始</button>
</div>

<script>
let audioCtx = null;
let bgmPlaying = false;

// DOM新增获取弹窗元素
const winMask = document.getElementById("winMask");
const winCountText = document.getElementById("winCountText");
const gameBox = document.getElementById('gameBox');

// 初始化音频上下文
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// 消除音效
function playMatchSound(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(980, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  osc.start();osc.stop(audioCtx.currentTime + 0.2);
}

// 过关胜利音效
function playWinSound(){
  initAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type='sine';
  osc.frequency.setValueAtTime(523,t);
  osc.frequency.setValueAtTime(659,t+0.2);
  osc.frequency.setValueAtTime(784,t+0.4);
  gain.gain.setValueAtTime(0.25,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.8);
  osc.start();osc.stop(t+0.8);
}

// ========= 【新版消消乐风格BGM，音量0.30】 =========
function startBGM(){
  if(bgmPlaying) return;
  initAudio();
  const bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 0.30;
  bgmGain.connect(audioCtx.destination);

  const melody = [
    523, 587, 659, 587,
    523, 494, 523, 392,
    523, 587, 659, 698,
    659, 587, 523, 523
  ];
  let noteIndex = 0;
  const beatTime = 0.32;

  const playNote = ()=>{
    if(!bgmPlaying) return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g);
    g.connect(bgmGain);
    o.type = 'sine';
    o.frequency.value = melody[noteIndex];
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + beatTime * 0.85);
    o.start(now);
    o.stop(now + beatTime);
    noteIndex = (noteIndex + 1) % melody.length;
  };
  bgmPlaying=true;
  setInterval(playNote, beatTime * 1000);
}
function stopBGM(){
  bgmPlaying=false;
}

//自动计算网格行列：方块固定52px+gap5px
function getAutoGridConfig(){
  const blockSize = 52 + 5;
  const availWidth = document.body.clientWidth - 24;
  const cols = Math.floor(availWidth / blockSize);
  const rows = Math.floor((window.innerHeight - 320) / blockSize);
  const baseRows = Math.max(4, rows);
  const baseCols = Math.max(4, cols);
  const totalCell = baseRows * baseCols;
  // 核心：基础目标分数 × 关卡难度系数，向上取整
  const baseTarget = totalCell * 12;
  const levelFactor = Math.pow(1.15, level - 1);
  const targetScore = Math.ceil(baseTarget * levelFactor);

  return {
    rows: baseRows,
    cols: baseCols,
    typeCount: Math.min(7, Math.floor((baseCols+baseRows)/2)),
    time: 120,
    step: totalCell * 2,
    target: targetScore
  };
}
const COLORS = ['🍎','🍐','🍊','🍇','🍓','🍋','🥝'];

let grid = [];
let selected = null;
let score = 0;
let remainStep = 0;
let remainTime = 0;
let timerId = null;
let gameRunning = false;
let level = 1;
let bestScore = parseInt(localStorage.getItem("matchBestScore")) || 0;

const scoreDom = document.getElementById('score');
const stepDom = document.getElementById('step');
const timerDom = document.getElementById('timer');
const levelDom = document.getElementById('level');
const goalDom = document.getElementById('goal');
const bestDom = document.getElementById('bestScore');
const tipDom = document.getElementById('tip');
const startBtnBig = document.getElementById('startBtnBig');
const startWrap = document.getElementById('startWrap');
const panel = document.getElementById('panel');
const resultBox = document.getElementById('resultBox');
const resTitle = document.getElementById('resTitle');
const resText = document.getElementById('resText');
const restartBtn = document.getElementById('restartBtn');

bestDom.textContent = bestScore;

function randomItem(typeCount){
  return COLORS[Math.floor(Math.random()*typeCount)];
}

function initBoard(conf){
  grid = [];
  for(let y=0;y<conf.rows;y++){
    grid[y]=[];
    for(let x=0;x<conf.cols;x++) grid[y][x]=randomItem(conf.typeCount);
  }
  while(findMatches(conf).length>0){
    for(let y=0;y<conf.rows;y++)for(let x=0;x<conf.cols;x++) grid[y][x]=randomItem(conf.typeCount);
  }
}

function render(conf){
  gameBox.style.gridTemplateColumns = `repeat(${conf.cols}, 52px)`;
  gameBox.innerHTML = '';
  for(let y=0;y<conf.rows;y++){
    for(let x=0;x<conf.cols;x++){
      const div = document.createElement('div');
      div.className = 'cell';
      if(selected && selected.x===x && selected.y===y) div.classList.add('selected');
      div.textContent = grid[y][x];
      div.onclick = ()=>clickCell(x,y,conf);
      gameBox.appendChild(div);
    }
  }
}

async function clickCell(x,y,conf){
  if(!gameRunning) return;
  if(!selected){
    selected = {x,y};
    render(conf);
  }else{
    const dx = Math.abs(selected.x - x);
    const dy = Math.abs(selected.y - y);
    if((dx===1 && dy===0) || (dx===0 && dy===1)){
      [grid[y][x], grid[selected.y][selected.x]] = [grid[selected.y][selected.x], grid[y][x]];
      const matchList = findMatches(conf);
      if(matchList.length>0){
        remainStep--;
        stepDom.textContent = remainStep;
        await processMatch(conf);
        checkGameOver(conf);
      }else{
        [grid[y][x], grid[selected.y][selected.x]] = [grid[selected.y][selected.x], grid[y][x]];
      }
    }
    selected = null;
    render(conf);
  }
}

function findMatches(conf){
  const matchSet = new Set();
  const {rows, cols} = conf;
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols-2;x++){
      const v = grid[y][x];
      if(v && grid[y][x+1]===v && grid[y][x+2]===v){
        matchSet.add(`${y},${x}`);
        matchSet.add(`${y},${x+1}`);
        matchSet.add(`${y},${x+2}`);
      }
    }
  }
  for(let x=0;x<cols;x++){
    for(let y=0;y<rows-2;y++){
      const v = grid[y][x];
      if(v && grid[y+1][x]===v && grid[y+2][x]===v){
        matchSet.add(`${y},${x}`);
        matchSet.add(`${y+1},${x}`);
        matchSet.add(`${y+2},${x}`);
      }
    }
  }
  return Array.from(matchSet).map(s=>{let [yy,xx]=s.split(',');return {y:+yy,x:+xx};});
}

async function processMatch(conf){
  let matchList = findMatches(conf);
  while(matchList.length>0){
    score += matchList.length * 10;
    scoreDom.textContent = score;
    matchList.forEach(p=>{
      const cellDom = gameBox.children[p.y*conf.cols + p.x];
      if(cellDom) cellDom.classList.add('pop');
    });
    playMatchSound();
    await sleep(300);
    matchList.forEach(p=> grid[p.y][p.x]=null);
    render(conf);
    await sleep(150);
    //方块下落
    for(let x=0;x<conf.cols;x++){
      let ptr = conf.rows-1;
      for(let y=conf.rows-1;y>=0;y--){
        if(grid[y][x]!==null){
          grid[ptr][x] = grid[y][x];
          if(ptr!==y) grid[y][x]=null;
          ptr--;
        }
      }
      for(let y=ptr;y>=0;y--){
        grid[y][x] = randomItem(conf.typeCount);
      }
    }
    render(conf);
    await sleep(150);
    matchList = findMatches(conf);
  }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function startTimer(){
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{
    remainTime--;
    timerDom.textContent = remainTime;
    if(remainTime<=0){
      gameOver("时间耗尽！");
    }
  },1000);
}

function checkGameOver(conf){
  if(score >= conf.target){
    gameRunning = false;
    clearInterval(timerId);
    playWinSound();
    // 显示奖章弹窗
    winMask.style.display='flex';
    if(score>bestScore){
      bestScore = score;
      localStorage.setItem("matchBestScore",bestScore);
      bestDom.textContent = bestScore;
    }
    //10秒倒计时自动下一关
    let countDown = 10;
    const autoTimer = setInterval(()=>{
      countDown--;
      winCountText.textContent=`${countDown}秒后自动进入下一关`;
      if(countDown<=0){
        clearInterval(autoTimer);
        winMask.style.display='none';
        level += 1;
        startGame();
      }
    },1000);
    return;
  }
  if(remainStep <=0){
    gameOver("步数用完！");
  }
}

function gameOver(msg){
  gameRunning = false;
  clearInterval(timerId);
  stopBGM();
  tipDom.className="";
  tipDom.textContent = "";
  winMask.style.display="none";
  if(score>bestScore){
    bestScore = score;
    localStorage.setItem("matchBestScore",bestScore);
    bestDom.textContent = bestScore;
  }
  //展示结算面板
  resultBox.style.display='block';
  resTitle.textContent = "游戏结束";
  resText.textContent = `${msg}\n本局得分：${score}\n🏆最高成就：${bestScore}`;
}

function startGame(){
  const conf = getAutoGridConfig();
  score = 0;
  remainStep = conf.step;
  remainTime = conf.time;
  selected = null;
  tipDom.className="";
  tipDom.textContent = "";
  winMask.style.display="none";
  scoreDom.textContent = score;
  stepDom.textContent = remainStep;
  timerDom.textContent = remainTime;
  levelDom.textContent = level;
  goalDom.textContent = conf.target;
  initBoard(conf);
  render(conf);
  gameRunning = true;
  resultBox.style.display='none';
  startTimer();
  startBGM();
}

//窗口尺寸变化，重新计算网格
window.addEventListener('resize', ()=>{
  if(gameRunning){
    const conf = getAutoGridConfig();
    render(conf);
    goalDom.textContent = conf.target;
  }
});

//点击开始游戏
startBtnBig.onclick = function(){
  startWrap.style.display='none';
  panel.style.display='block';
  startGame();
}

restartBtn.onclick = function(){
  stopBGM();
  gameRunning = false;
  clearInterval(timerId);
  tipDom.className="";
  tipDom.textContent="";
  level = 1;
  resultBox.style.display='none';
  startWrap.style.display='flex';
  panel.style.display='none';
}
</script>
</body>
</html>
